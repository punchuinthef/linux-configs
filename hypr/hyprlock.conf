general {
    hide_cursor = false
}


animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor = DP-4
    path = screenshot
    blur_passes = 6
}

input-field {
    monitor = DP-4
    size = 10%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 50

    font_family = NovaMono
    placeholder_text = Hey, $USER :) 
    fail_text = Sorry, that's incorrect! Try again...
    
   

    # uncomment if you wish to display a message during authentication
    check_text = Please wait... Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_sizNe = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 90
    halign = center
    valign = bottom

}


# TIME
label {
    monitor = DP-4
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 250
    font_family = Caacupe One

    position = 0, 0
    halign = center
    valign = center
}

# DATE
label {
    monitor = DP-4
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 50
    font_family = Ranchers

    position = -30, -900
    halign = center
    valign = top
}





